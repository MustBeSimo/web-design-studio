name: Publish npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, for example v3.0.1; omit only when dispatching on a tag'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    # Never publish media archives or the moving main branch.
    if: >-
      startsWith(github.event.release.tag_name || inputs.tag || github.ref_name, 'v') &&
      (github.event_name == 'release' || inputs.tag != '' || github.ref_type == 'tag')
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Verify release tag matches the package
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error('Release tag must match package.json version');
          }
          NODE
      # Node 22 can ship npm 10; OIDC publishing needs npm >=11.5.1.
      - name: Set up npm with trusted publishing support
        run: npm install --global npm@11 --no-audit --no-fund
      - run: npm install --no-audit --no-fund
      - run: node tools/check-skills.mjs --forbid-root-skill
      # The site-link gate counts paths on the media branch as served; a tag checkout has no such ref.
      - name: Fetch the media overlay ref
        run: git fetch --depth=1 origin +refs/heads/media:refs/remotes/origin/media
      - run: npm test
      - run: npm publish --provenance --access public

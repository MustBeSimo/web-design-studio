<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Blind review · Skill A/B/C v3</title>
  <style>
    :root{color-scheme:light dark;--ink:#eef3ff;--paper:#0a1020;--panel:#111a30;--line:#4c6082;--accent:#34ddff;--accent2:#ff4fb8;--muted:#9aa9c4;font-family:Inter,ui-sans-serif,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink)}header,main{max-width:1500px;margin:auto;padding:18px 24px}h1,h2{font-family:Georgia,serif;font-weight:400;letter-spacing:.04em}h1{margin:.1em 0;font-size:clamp(2rem,5vw,4.8rem)}p{line-height:1.5}a{color:var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}.notice{border:1px solid var(--line);border-radius:999px;padding:9px 14px;display:inline-block}.group{border-top:1px solid var(--line);padding:22px 0}.candidates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.candidate{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:12px;box-shadow:0 14px 40px #0005}iframe{width:100%;height:560px;border:1px solid var(--line);border-radius:16px;background:white}.label{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.label b{font:400 2rem Georgia,serif;color:var(--accent)}button,.button{border:0;border-radius:999px;background:var(--accent);color:#06101b;padding:10px 15px;font-weight:800;cursor:pointer}.shots{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px}.shots img{display:block;width:100%;border-radius:8px;border:1px solid var(--line)}fieldset{border:0;margin:12px 0 0;padding:0}label{display:flex;justify-content:space-between;gap:10px;margin:7px 0;color:var(--muted)}input[type=range]{accent-color:var(--accent2);width:48%}.winner{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:16px}.winner label,.check{justify-content:flex-start;color:var(--ink)}footer{position:sticky;bottom:0;background:#0a1020ee;border-top:1px solid var(--line);padding:12px 24px;display:flex;justify-content:space-between;align-items:center}@media(max-width:900px){.candidates{grid-template-columns:1fr}iframe{height:640px}header,main{padding-inline:12px}}
  </style>
</head>
<body><header><span class="notice">Author-blinded · conditions and costs hidden</span><h1>Interactive taste review</h1><p>Explore each live build, then inspect the same opening, signature, transition and closing frames on desktop and mobile. Rate the five dimensions before choosing one or more winners; selecting more than one records a tie.</p></header><main id="app"></main><footer><label class="check"><input id="blinded" type="checkbox"> I completed ratings before viewing the condition map or costs.</label><button id="export">Export complete ratings</button></footer>
<script type="module">
const manifest=await fetch('./manifest.json').then(r=>r.json()); const app=document.querySelector('#app'); const names={brandFit:'Brand fit',composition:'Composition',typography:'Typography',motionPurpose:'Motion purpose',mobileReadability:'Mobile readability'};
const escapeHtml=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const saved=JSON.parse(localStorage.getItem('skill-ab-v3-ratings')||'{}');
for(const group of manifest.groups){const section=document.createElement('section');section.className='group';section.dataset.group=group.id;section.innerHTML=`<h2>${group.category.replaceAll('-',' ')} · attempt ${group.attempt}</h2><details><summary>Approved supplied copy</summary><ul>${group.approvedCopy.map(text=>`<li>${escapeHtml(text)}</li>`).join('')}</ul></details><div class="candidates"></div><div class="winner"><strong>Preferred:</strong>${group.candidates.map(c=>`<label><input type="checkbox" data-winner="${c.label}">${c.label}</label>`).join('')}</div>`; const grid=section.querySelector('.candidates');
 for(const c of group.candidates){const card=document.createElement('article');card.className='candidate';card.dataset.label=c.label;const dimensions=manifest.dimensions.map(d=>`<label>${names[d]}<input type="range" min="1" max="5" step="1" value="3" data-dimension="${d}"></label>`).join('');const shots=['opening','signature','transition','closing'].map(stage=>`<img src="captures/${group.id}/${c.label}/desktop-${stage}.png" alt="${c.label} ${stage} desktop frame"><img src="captures/${group.id}/${c.label}/mobile-${stage}.png" alt="${c.label} ${stage} mobile frame">`).join('');const claims=c.claimCandidates.length?`<details open><summary>Automated extra-text candidates</summary><ul>${c.claimCandidates.map(item=>`<li><q>${escapeHtml(item.text)}</q><br><small>Residue: ${escapeHtml(item.residual)}</small></li>`).join('')}</ul></details>`:`<p><small>Automated scan found no extra-text candidate; compare the live build with the approved copy above.</small></p>`;card.innerHTML=`<div class="label"><b>${c.label}</b><a href="${c.url}" target="_blank">Open live ↗</a></div><iframe src="${c.url}" title="Candidate ${c.label}"></iframe><div class="shots">${shots}</div>${claims}<fieldset>${dimensions}<label class="check"><input type="checkbox" data-claims> I compared this build with the approved copy and adjudicated all extra-text candidates.</label></fieldset>`;grid.append(card)} app.append(section)}
function snapshot(){return{protocolVersion:manifest.protocolVersion,authorBlinded:document.querySelector('#blinded').checked,groups:[...document.querySelectorAll('.group')].map(group=>({id:group.dataset.group,winners:[...group.querySelectorAll('[data-winner]:checked')].map(i=>i.dataset.winner),ratings:Object.fromEntries([...group.querySelectorAll('.candidate')].map(card=>[card.dataset.label,Object.fromEntries([...card.querySelectorAll('[data-dimension]')].map(i=>[i.dataset.dimension,Number(i.value)]))])),claimsReviewed:Object.fromEntries([...group.querySelectorAll('.candidate')].map(card=>[card.dataset.label,card.querySelector('[data-claims]').checked]))}))}}
function restore(){if(saved.groups)for(const group of saved.groups){const el=document.querySelector(`[data-group="${group.id}"]`);if(!el)continue;for(const winner of group.winners||[])el.querySelector(`[data-winner="${winner}"]`).checked=true;for(const [label,ratings]of Object.entries(group.ratings||{}))for(const[d,value]of Object.entries(ratings))el.querySelector(`[data-label="${label}"] [data-dimension="${d}"]`).value=value;for(const[label,value]of Object.entries(group.claimsReviewed||{}))el.querySelector(`[data-label="${label}"] [data-claims]`).checked=value}document.querySelector('#blinded').checked=!!saved.authorBlinded}restore();document.addEventListener('change',()=>localStorage.setItem('skill-ab-v3-ratings',JSON.stringify(snapshot())));document.querySelector('#export').onclick=()=>{const data=snapshot();const incomplete=!data.authorBlinded||data.groups.some(g=>!g.winners.length||Object.values(g.claimsReviewed).some(v=>!v));if(incomplete){alert('Complete winner, claims review and author-blinding confirmation first.');return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)+'\n'],{type:'application/json'}));a.download='skill-ab-v3-ratings.json';a.click()};
</script></body></html>
